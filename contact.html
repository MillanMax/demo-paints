<body data-page="contact">
<div id="site-header"></div>
<main id="main">
<div class="page-hero"><div class="container"><div class="crumbs"><a href="index.html">Home</a> <i data-ic="chevron-right"></i> Contact</div><h1>Contact Us</h1><p>Questions about products, colours or orders? We are happy to help.</p></div></div><section class="section"><div class="container grid g2" style="gap:40px;align-items:start"><div><form id="contact-form" novalidate>
<div class="form-row"><div class="field"><label for="ct-name">Name *</label><input id="ct-name" name="name" autocomplete="name"><span class="err"></span></div><div class="field"><label for="ct-email">Email *</label><input id="ct-email" name="email" type="email" autocomplete="email"><span class="err"></span></div></div>
<div class="form-row"><div class="field"><label for="ct-phone">Phone</label><input id="ct-phone" name="phone" type="tel" autocomplete="tel"></div><div class="field"><label for="ct-subject">Subject</label><select id="ct-subject" name="subject"><option>General enquiry</option><option>Product advice</option><option>Order support</option><option>Become a dealer</option><option>Careers</option></select></div></div>
<div class="field"><label for="ct-message">Message *</label><textarea id="ct-message" name="message"></textarea><span class="err"></span></div><button class="btn btn-primary" type="submit">Send message</button></form><div id="contact-result" class="mt" aria-live="polite"></div></div>
<div class="grid" style="gap:16px"><div class="grid g2 keep2"><div class="info-card"><h3 class="ic-h"><i data-ic="pin"></i>Visit</h3><p class="muted">Plot 00, Industrial Area, Kampala, Uganda</p></div><div class="info-card"><h3 class="ic-h"><i data-ic="phone"></i>Call</h3><p><a href="tel:+256700000000">+256 700 000 000</a></p></div><div class="info-card"><h3 class="ic-h"><i data-ic="mail"></i>Email</h3><p><a href="mailto:sales@demopaints.example">sales@demopaints.example</a></p></div><div class="info-card"><h3 class="ic-h"><i data-ic="clock"></i>Hours</h3><p class="muted">Mon–Sat 8:00–18:00<br>Sun closed</p></div></div>
<iframe title="Map of Kampala" loading="lazy" style="width:100%;height:300px;border:0;border-radius:14px" src="https://www.openstreetmap.org/export/embed.html?bbox=32.52%2C0.28%2C32.64%2C0.35&layer=mapnik&marker=0.3136%2C32.5811"></iframe></div></div></section>
</main>
